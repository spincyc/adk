# The course: eighteen arcs of three lessons. Two lessons each teach a part;
# the third is a project that puts them together. The first twelve use the
# kits' parts; the next two add radios; the last four join two boards over
# a LoRa bridge (boards: 2). This file is the one list of lessons: the
# navigation, the course map and the home page are built from it, and a
# lesson appears as a link once its page exists.

- arc: First light
  lessons:
    - {slug: 001-blink, title: Blink, builds: An LED that blinks on and off}
    - {slug: 002-buttons, title: Buttons, builds: Buttons that switch lights and count presses}
    - {slug: 003-reaction-duel, title: Reaction Duel, builds: A two-player reflex game with a buzzer, project: true}

- arc: Color and sound
  lessons:
    - {slug: 004-mood-lamp, title: Mood Lamp, builds: An RGB lamp that fades through colors}
    - {slug: 005-melody-maker, title: Melody Maker, builds: A four-button keyboard that plays tunes}
    - {slug: 006-simon, title: Simon, builds: The memory game, with sound and a high score, project: true}

- arc: The analog world
  lessons:
    - {slug: 007-dimmer, title: Dimmer, builds: A knob that dims an LED smoothly}
    - {slug: 008-light-meter, title: Light Meter, builds: A bar graph of how bright the room is}
    - {slug: 009-light-theremin, title: Light Theremin, builds: An instrument you play by waving your hand, project: true}

- arc: Digits
  lessons:
    - {slug: 010-dice, title: Dice, builds: An electronic die on a seven-segment digit}
    - {slug: 011-four-digits, title: Four Digits, builds: A counter on a four-digit display}
    - {slug: 012-stopwatch, title: Stopwatch, builds: A stopwatch and countdown timer, project: true}

- arc: Words and weather
  lessons:
    - {slug: 013-hello-lcd, title: "Hello, LCD", builds: Text and little animations on a character screen}
    - {slug: 014-thermometers, title: Thermometers, builds: Temperature and humidity three ways}
    - {slug: 015-weather-station, title: Weather Station, builds: A desk weather station with a comfort light, project: true}

- arc: Keys and motion
  lessons:
    - {slug: 016-keypad, title: Keypad, builds: A calculator on a keypad and screen}
    - {slug: 017-servo, title: Servo, builds: A dial whose needle follows a knob}
    - {slug: 018-keypad-safe, title: Keypad Safe, builds: A box that opens with a secret code, project: true}

- arc: Distance and motors
  lessons:
    - {slug: 019-parking-sensor, title: Parking Sensor, builds: Beeps that speed up as you get closer}
    - {slug: 020-fan, title: Fan, builds: A motor-driven fan with speed and direction}
    - {slug: 021-follow-me-fan, title: Follow-Me Fan, builds: A fan that turns to find you, project: true}

- arc: Invisible signals
  lessons:
    - {slug: 022-remote-control, title: Remote Control, builds: A lamp you control from the sofa}
    - {slug: 023-tripwires, title: Tripwires, builds: Motion, tilt and beam-break sensors}
    - {slug: 024-room-alarm, title: Room Alarm, builds: An alarm you arm and disarm with the remote, project: true}

- arc: Pixels and games
  lessons:
    - {slug: 025-led-matrix, title: LED Matrix, builds: Pictures and scrolling text on 64 LEDs}
    - {slug: 026-joystick, title: Joystick, builds: An etch-a-sketch for the matrix}
    - {slug: 027-snake, title: Snake, builds: The classic game, with sound, project: true}

- arc: Tilt and turn
  lessons:
    - {slug: 028-tilt, title: Tilt, builds: A spirit level that shows which way is down}
    - {slug: 029-menus, title: Menus, builds: A menu you scroll with a rotary knob}
    - {slug: 030-tilt-maze, title: Tilt Maze, builds: A maze you solve by tilting the board, project: true}

- arc: Time
  lessons:
    - {slug: 031-stepper, title: Stepper, builds: A motor that moves in exact steps}
    - {slug: 032-real-time-clock, title: Real-Time Clock, builds: A clock that remembers the time}
    - {slug: 033-alarm-clock, title: Alarm Clock, builds: A clock that wakes you with a tune, project: true}

- arc: Keys you can't see
  lessons:
    - {slug: 034-rfid, title: RFID, builds: A reader that knows your card}
    - {slug: 035-knocks-and-relays, title: Knocks and Relays, builds: A secret knock that switches a lamp}
    - {slug: 036-secret-door, title: Secret Door, builds: A door that opens for the right card or knock, project: true}

- arc: On the air
  lessons:
    - {slug: 037-fm-radio, title: FM Radio, builds: A radio you tune with the rotary knob}
    - {slug: 038-radio-messages, title: Radio Messages, builds: Messages sent through the air at 433 MHz}
    - {slug: 039-clock-radio, title: Clock Radio, builds: A radio that wakes you with your station, project: true}

- arc: Long range
  lessons:
    - {slug: 040-lora, title: LoRa, builds: Messages that reach a kilometer}
    - {slug: 041-lora-link, title: LoRa Link, builds: A weather report sent by radio}
    - {slug: 042-mesh-messenger, title: Mesh Messenger, builds: Texts from your phone to your Mega, project: true}

- arc: Two boards
  boards: 2
  lessons:
    - {slug: 043-the-bridge, title: The Bridge, builds: Two boards that light each other's LEDs across a house}
    - {slug: 044-remote-dial, title: Remote Dial, builds: A dial on one board that turns a servo on the other}
    - {slug: 045-remote-turret, title: Remote Turret, builds: A fan across the room you aim with a joystick, project: true}

- arc: Far senses
  boards: 2
  lessons:
    - {slug: 046-remote-weather, title: Remote Weather, builds: The garden's weather, read indoors}
    - {slug: 047-remote-alarm, title: Remote Alarm, builds: Sensors by the door and the siren where you are}
    - {slug: 048-baby-monitor, title: Baby Monitor, builds: A room's sound and a leak alarm, heard from afar, project: true}

- arc: Far hands
  boards: 2
  lessons:
    - {slug: 049-remote-keypad, title: Remote Keypad, builds: A keypad by the door that opens a latch inside}
    - {slug: 050-tilt-pilot, title: Tilt Pilot, builds: Tilt one board to roll a ball across the other}
    - {slug: 051-doorbell-and-door, title: Doorbell and Door, builds: A doorbell that says who's there and lets them in, project: true}

- arc: Far machines
  boards: 2
  lessons:
    - {slug: 052-remote-stepper, title: Remote Stepper, builds: A turntable set to any angle from across the room}
    - {slug: 053-remote-lamp, title: Remote Lamp, builds: A remote control that works through walls}
    - {slug: 054-radio-pong, title: Radio Pong, builds: Pong played between two rooms, project: true}
