# The project course has eighteen arcs of three lessons. Two lessons each
# introduce a part or an idea; the third is a project that builds on them,
# though not always on both, and may bring in something new. The first
# twelve use the kits' parts; the next two add radios; the next four join
# two boards over a LoRa bridge (boards: 2). Extras stand on their own. The
# Electricity track follows as eight arcs of three investigations, and can
# be started alongside the project course. This file is the one list: the
# navigation, the course map and the home page are built from it, and a
# lesson appears as a link once its page exists.

- arc: First light
  lessons:
