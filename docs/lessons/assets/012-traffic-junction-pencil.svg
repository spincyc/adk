<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
<defs>
  <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2"
      seed="12" result="grain"/>
    <feDisplacementMap in="SourceGraphic" in2="grain" scale="1.35"/>
  </filter>
</defs>
<style>
path,rect,circle,line,polyline,polygon{filter:url(#pencil)}
.p{fill:#faf9f4;stroke:#222;stroke-width:2}.l{fill:none;stroke:#333;stroke-width:2}.g{fill:none;stroke:#888;stroke-width:1}
.t{font:20px Go,sans-serif;fill:#222}.h{font:bold 27px Go,sans-serif;fill:#222}.m{font:16px "Go Mono",monospace;fill:#222}.s{font:14px "Go Mono",monospace;fill:#222}
</style>
<rect width="1400" height="1050" fill="#fffefa"/>
<text x="35" y="38" class="h">LESSON 012 — FOUR WIRING PLATES</text>
<text x="35" y="66" class="t">Physical locators plus two reference worksheets. Match silkscreen and coordinates; disconnect USB while changing wires.</text>

<!-- Plate 1 -->
<rect x="30" y="90" width="650" height="430" rx="12" class="p"/>
<text x="50" y="125" class="h">1. Mega 2560 physical header locator</text>
<path d="M65 155h560v325H65z" class="l"/>
<rect x="78" y="205" width="55" height="105" class="l"/><text x="82" y="197" class="s">USB</text>
<circle cx="105" cy="430" r="24" class="l"/><text x="75" y="468" class="s">POWER JACK</text>
<text x="250" y="320" class="h">MEGA 2560</text>
<text x="465" y="178" class="s">D22-D53 PAIRED HEADER</text>
<g class="s">
<text x="455" y="205">inner</text><text x="540" y="205">outer</text>
<text x="455" y="225">22 DS</text><text x="540" y="225">23 SHCP</text>
<text x="455" y="243">24 STCP</text><text x="540" y="243">25 BUTTON</text>
<text x="455" y="261">26</text><text x="540" y="261">27</text>
<text x="455" y="279">28</text><text x="540" y="279">29</text>
<text x="455" y="297">30 main R</text><text x="540" y="297">31 main Y</text>
<text x="455" y="315">32 main G</text><text x="540" y="315">33 side R</text>
<text x="455" y="333">34 side Y</text><text x="540" y="333">35 side G</text>
<text x="455" y="351">36 WALK</text><text x="540" y="351">37 STOP</text>
<text x="455" y="369">38 ... 52</text><text x="540" y="369">39 ... 53</text>
</g>
<g fill="#fff" stroke="#222">
<circle cx="440" cy="220" r="5"/><circle cx="525" cy="220" r="5"/><circle cx="440" cy="238" r="5"/><circle cx="525" cy="238" r="5"/>
<circle cx="440" cy="256" r="5"/><circle cx="525" cy="256" r="5"/><circle cx="440" cy="274" r="5"/><circle cx="525" cy="274" r="5"/>
<circle cx="440" cy="292" r="5"/><circle cx="525" cy="292" r="5"/><circle cx="440" cy="310" r="5"/><circle cx="525" cy="310" r="5"/>
<circle cx="440" cy="328" r="5"/><circle cx="525" cy="328" r="5"/><circle cx="440" cy="346" r="5"/><circle cx="525" cy="346" r="5"/>
</g>
<text x="165" y="180" class="s">D13 header / built-in LED</text>
<text x="165" y="430" class="s">POWER header: 5V and GND</text>
<text x="50" y="500" class="s">USB and barrel jack are at left; use the board's printed socket labels.</text>

<!-- Plate 2 -->
<rect x="720" y="90" width="650" height="430" rx="12" class="p"/>
<text x="740" y="125" class="h">2. 74HC595 across the breadboard trench</text>
<line x1="750" y1="165" x2="1340" y2="165" class="g"/><text x="755" y="158" class="s">+5V RAIL</text>
<line x1="750" y1="188" x2="1340" y2="188" class="g"/><text x="755" y="184" class="s">GND RAIL</text>
<rect x="760" y="210" width="565" height="250" class="g"/>
<rect x="760" y="325" width="565" height="20" fill="#fffefa" stroke="#888"/>
<text x="1220" y="341" class="s">TRENCH</text>
<rect x="920" y="250" width="235" height="160" rx="4" fill="#eee" stroke="#222" stroke-width="2"/>
<path d="M1015 250q20 25 40 0" class="l"/>
<g class="s">
<text x="790" y="270">row 20: 1 QB</text><text x="1170" y="270">16 VCC -> 5V</text>
<text x="790" y="290">row 21: 2 QC</text><text x="1170" y="290">15 QA</text>
<text x="790" y="310">row 22: 3 QD</text><text x="1170" y="310">14 DS from D22</text>
<text x="790" y="365">row 23: 4 QE</text><text x="1170" y="365">13 OE -> GND</text>
<text x="790" y="385">row 24: 5 QF</text><text x="1170" y="385">12 STCP from D24</text>
<text x="790" y="405">row 25: 6 QG</text><text x="1170" y="405">11 SHCP from D23</text>
<text x="790" y="425">row 26: 7 QH</text><text x="1170" y="425">10 MR -> 5V</text>
<text x="790" y="445">row 27: 8 GND</text><text x="1170" y="445">9 QH' unused</text>
</g>
<text x="750" y="485" class="t">Notch up. One 0.1 uF capacitor directly from pin 16 to pin 8.</text>

<!-- Plate 3 -->
<rect x="30" y="550" width="650" height="460" rx="12" class="p"/>
<text x="50" y="585" class="h">3. Signal breadboard — physical top view</text>
<text x="50" y="612" class="s">A-E connected per row; F-J connected per row; trench separates them.</text>
<line x1="65" y1="642" x2="650" y2="642" class="g"/><text x="70" y="637" class="s">+ RAIL</text>
<line x1="65" y1="662" x2="650" y2="662" class="g"/><text x="70" y="658" class="s">GND RAIL</text>
<rect x="65" y="680" width="585" height="265" class="g"/>
<rect x="330" y="680" width="28" height="265" fill="#fffefa" stroke="#888"/>
<text x="303" y="970" class="s">A B C D E | F G H I J</text>
<g class="s">
<text x="75" y="705">10-12 D30 main R</text><text x="245" y="705">A10--330R--A11; C11 LED C12; A12--GND</text>
<text x="75" y="733">14-16 D31 main Y</text><text x="245" y="733">A14--330R--A15; C15 LED C16; A16--GND</text>
<text x="75" y="761">18-20 D32 main G</text><text x="245" y="761">A18--330R--A19; C19 LED C20; A20--GND</text>
<text x="75" y="797">24-26 D33 side R</text><text x="245" y="797">A24--330R--A25; C25 LED C26; A26--GND</text>
<text x="75" y="825">28-30 D34 side Y</text><text x="245" y="825">A28--330R--A29; C29 LED C30; A30--GND</text>
<text x="75" y="853">32-34 D35 side G</text><text x="245" y="853">A32--330R--A33; C33 LED C34; A34--GND</text>
<text x="75" y="889">38-40 D36 WALK</text><text x="245" y="889">A38--330R--A39; C39 LED C40; A40--GND</text>
<text x="75" y="917">42-44 D37 STOP</text><text x="245" y="917">A42--330R--A43; C43 LED C44; A44--GND</text>
<text x="75" y="940">48/50 D25 BUTTON</text><text x="245" y="940">button straddles trench: E48 to D25; F50 to GND</text>
</g>
<text x="50" y="998" class="s">LED long leg in the lower-numbered signal row; bridge split rails like-to-like.</text>

<!-- Plate 4 -->
<rect x="720" y="550" width="650" height="460" rx="12" class="p"/>
<text x="740" y="585" class="h">4. Display mapping — specimen gate</text>
<text x="740" y="617" class="t">Proceed only after the marking confirms common cathode.</text>
<rect x="1110" y="650" width="170" height="220" rx="8" class="l"/>
<text x="1135" y="755" class="h">DISPLAY</text>
<g class="m">
<text x="755" y="665">QA -> 1k -> a -> pin ____</text>
<text x="755" y="700">QB -> 1k -> b -> pin ____</text>
<text x="755" y="735">QC -> 1k -> c -> pin ____</text>
<text x="755" y="770">QD -> 1k -> d -> pin ____</text>
<text x="755" y="805">QE -> 1k -> e -> pin ____</text>
<text x="755" y="840">QF -> 1k -> f -> pin ____</text>
<text x="755" y="875">QG -> 1k -> g -> pin ____</text>
<text x="755" y="910">QH -> 1k -> DP -> pin ___</text>
<text x="755" y="955">common cathode pin(s) ____ -> GND</text>
</g>
<text x="740" y="995" class="s">Eight 1k resistors; never borrow another display's pinout.</text>
</svg>
