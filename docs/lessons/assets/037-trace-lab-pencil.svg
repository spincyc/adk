    <path class="ink" d="M890 635H1010V560H1490"/>
    <path class="ink" d="M1320 540l35 45 35-45M1355 585V665"/>
  </g>
  <g transform="rotate(-0.25 800 410)">
    <text class="title" x="105" y="125">1  SHORT PULSE</text>
    <text class="note" x="105" y="330">predict: no attack</text>
    <text class="title" x="885" y="125">2  CHATTER TRAIN</text>
