<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <filter id="pencil"><feTurbulence type="fractalNoise" baseFrequency=".015" numOctaves="3" seed="39" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter>
    <style>.card{fill:#fafaf7;stroke:#222;stroke-width:5}.ink{fill:none;stroke:#222;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.title{fill:#222;font-family:'DejaVu Sans';font-size:34px;font-style:italic}.note{fill:#222;font-family:'DejaVu Sans';font-size:27px}</style>
  </defs>
  <rect width="1600" height="820" fill="#fff"/>
  <g filter="url(#pencil)">
    <rect class="card" x="55" y="60" width="710" height="310" rx="24"/>
    <rect class="card" x="835" y="60" width="710" height="310" rx="24"/>
    <rect class="card" x="55" y="445" width="710" height="310" rx="24"/>
    <rect class="card" x="835" y="445" width="710" height="310" rx="24"/>
    <text class="title" x="105" y="125">1  SHORT PULSE</text>
    <text class="note" x="105" y="330">predict: no attack</text>
    <text class="title" x="885" y="125">2  CHATTER TRAIN</text>
    <text class="note" x="885" y="330">predict: one accepted attack</text>
    <text class="title" x="105" y="510">3  REFRACTORY PAIR</text>
    <text class="note" x="105" y="715">predict: second suppressed</text>
    <text class="title" x="885" y="510">4  HELD CONTACT</text>
    <text class="note" x="885" y="715">predict: stuck, then release</text>
    <path class="ink" d="M110 250H260V175H390V250H705"/>
    <path class="ink" d="M890 250H1010V180H1080V250H1150V180H1225V250H1290V180H1490"/>
