<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Raised-wheel rover simulator evidence path</title>
  <desc id="description">A pencil-style diagram showing simulated range and wheel observations flowing into RoverController. Six direction and enable lamps present applied intent, while a stop request dominates every motion command and makes all six lamps dark.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#202020"/>
    </marker>
    <style>
      .line { fill: none; stroke: #202020; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .light { fill: none; stroke: #555; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #555; stroke-width: 2.5; stroke-dasharray: 9 8; }
      .paper { fill: #faf9f5; stroke: #202020; stroke-width: 3; }
      .label, .small, .tiny { display: none; }
      .strong { font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#faf9f5"/>
  <g>
    <text x="600" y="45" text-anchor="middle" class="label strong">Lesson 021 — observe the whole rover decision</text>
    <text x="600" y="75" text-anchor="middle" class="small">E1: seven LED witnesses • E2 drawing: raised wheels and physical power disconnect</text>

    <!-- Input evidence -->
    <path class="paper" d="M 45 120 Q 42 116 50 112 L 290 114 Q 298 112 299 121 L 296 478 Q 298 486 289 487 L 49 484 Q 42 486 44 477 z"/>
    <text x="170" y="153" text-anchor="middle" class="label strong">OBSERVE</text>
    <text x="68" y="187" class="small">simulated wheel edges</text>
    <rect x="76" y="207" width="188" height="58" rx="7" class="line"/>
    <path d="M 101 236 L 145 236 M 123 214 L 123 258" class="line"/>
    <text x="172" y="242" class="small">left + right</text>

    <text x="68" y="306" class="small">simulated range echo</text>
    <path d="M 83 341 Q 107 316 131 341 Q 155 366 179 341" class="line"/>
    <path d="M 184 341 Q 208 316 232 341" class="light"/>
    <text x="170" y="387" text-anchor="middle" class="tiny">500 mm; then 150 mm</text>

    <text x="68" y="425" class="small">stop request</text>
    <circle cx="111" cy="454" r="25" class="line"/>
    <path d="M 94 454 L 128 454" class="line"/>
    <text x="153" y="461" class="small strong">STOP</text>

    <!-- Decision -->
    <path d="M 300 235 C 336 235 340 235 370 235" class="line" marker-end="url(#arrow)"/>
    <path d="M 300 352 C 336 352 340 352 370 352" class="line" marker-end="url(#arrow)"/>
    <path d="M 300 454 C 339 454 341 430 370 430" class="line" marker-end="url(#arrow)"/>
    <path class="paper" d="M 380 155 Q 377 149 386 147 L 676 151 Q 684 149 685 158 L 681 456 Q 684 465 674 466 L 386 463 Q 378 466 380 456 z"/>
    <text x="531" y="194" text-anchor="middle" class="label strong">DECIDE</text>
    <text x="531" y="231" text-anchor="middle" class="small">RoverController</text>
    <path d="M 423 267 L 639 267" class="light"/>
    <text x="531" y="305" text-anchor="middle" class="small">valid intent?</text>
    <text x="531" y="342" text-anchor="middle" class="small">clear range?</text>
    <path d="M 423 365 L 639 365" class="light"/>
    <rect x="420" y="386" width="222" height="46" rx="5" class="line"/>
    <text x="531" y="417" text-anchor="middle" class="small strong">STOP DOMINATES</text>

    <!-- Rover output evidence -->
    <path d="M 686 281 C 724 281 728 281 754 281" class="line" marker-end="url(#arrow)"/>
    <path d="M 686 410 C 724 410 728 410 754 410" class="line" marker-end="url(#arrow)"/>
    <path class="paper" d="M 765 112 Q 761 108 770 105 L 1152 109 Q 1160 107 1158 117 L 1155 513 Q 1158 521 1149 522 L 770 519 Q 762 522 764 512 z"/>
    <text x="961" y="150" text-anchor="middle" class="label strong">ACTUATE + VERIFY</text>

    <!-- Rover body and wheels -->
    <path d="M 840 278 L 884 215 L 1036 215 L 1082 278 L 1067 354 L 852 354 z" class="line"/>
    <rect x="896" y="240" width="129" height="67" rx="6" class="line"/>
    <text x="960" y="269" text-anchor="middle" class="tiny">motion intent</text>
    <text x="960" y="293" text-anchor="middle" class="tiny">not motor power</text>
    <circle cx="865" cy="374" r="46" class="line"/>
    <circle cx="1060" cy="374" r="46" class="line"/>
    <circle cx="865" cy="374" r="13" class="light"/>
    <circle cx="1060" cy="374" r="13" class="light"/>
    <path d="M 818 432 L 1107 432 M 855 432 L 829 473 M 1070 432 L 1095 473 M 805 473 L 1121 473" class="line"/>
    <path d="M 820 414 C 806 396 806 358 821 341 M 1104 414 C 1119 396 1119 358 1104 341" class="dash"/>
    <text x="960" y="503" text-anchor="middle" class="small strong">stand keeps both wheels raised</text>

    <!-- Output indicators -->
    <circle cx="807" cy="187" r="15" class="line"/>
    <path d="M 797 177 L 817 197 M 817 177 L 797 197" class="light"/>
    <text x="835" y="194" class="small">D13 acquisition + six command lamps</text>
    <circle cx="807" cy="554" r="15" class="line"/>
    <path d="M 797 544 L 817 564 M 817 544 L 797 564" class="light"/>
    <text x="835" y="561" class="small strong">stop: all six lamps dark</text>

    <!-- Dominance path -->
    <path d="M 532 432 C 535 550 675 589 787 556" class="line" marker-end="url(#arrow)"/>
    <text x="548" y="541" class="small strong">dominant evidence path</text>

    <!-- Prediction footer -->
    <path d="M 45 606 Q 42 601 51 599 L 1150 601 Q 1158 598 1156 608 L 1154 666 Q 1157 674 1148 674 L 50 672 Q 43 674 45 665 z" class="paper"/>
    <text x="67" y="634" class="small strong">Predict:</text>
    <text x="160" y="634" class="small">supply stopRequested during forward intent.</text>
    <text x="67" y="662" class="small strong">Observe:</text>
    <text x="160" y="662" class="small">both commands stop and all six witnesses become dark in the same update.</text>
  </g>
</svg>
