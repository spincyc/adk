<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <filter id="paper">
      <feTurbulence baseFrequency="0.012" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/>
    </filter>
    <style>
      .ink{fill:none;stroke:#222;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .fine{fill:none;stroke:#555;stroke-width:2}
      .wire{fill:none;stroke:#111;stroke-width:5;stroke-linecap:round}
      .ghost{fill:none;stroke:#999;stroke-width:2;stroke-dasharray:8 7}
      .title{font-family:Open Sans,sans-serif;font-size:31px;font-style:italic;fill:#111}
      .label{font-family:Open Sans,sans-serif;font-size:24px;fill:#222}
      .small{font-family:Open Sans,sans-serif;font-size:19px;fill:#333}
      .tiny{font-family:Open Sans,sans-serif;font-size:15px;fill:#333}
      .hole{fill:#fff;stroke:#444;stroke-width:1.5}
      .used{fill:#222;stroke:#111;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#fafafa"/>
  <g filter="url(#paper)">
    <text x="65" y="55" class="title">Lesson 023 — literal Mega headers and one breadboard</text>

    <!-- Mega locator -->
    <rect x="55" y="90" width="450" height="940" rx="25" class="ink"/>
    <rect x="85" y="130" width="195" height="75" rx="8" class="ink"/>
    <text x="112" y="176" class="label">MEGA 2560</text>
    <rect x="90" y="910" width="85" height="55" class="ink"/>
    <text x="100" y="945" class="small">USB</text>

    <text x="72" y="260" class="small">top digital header</text>
    <g>
      <circle cx="105" cy="300" r="7" class="hole"/><text x="92" y="334" class="tiny">8</text>
      <circle cx="145" cy="300" r="7" class="hole"/><text x="130" y="334" class="tiny">9</text>
      <circle cx="185" cy="300" r="7" class="hole"/><text x="164" y="334" class="tiny">10</text>
      <circle cx="225" cy="300" r="7" class="hole"/><text x="204" y="334" class="tiny">11</text>
      <circle cx="265" cy="300" r="8" class="used"/><text x="244" y="334" class="tiny">12</text>
      <circle cx="305" cy="300" r="8" class="used"/><text x="284" y="334" class="tiny">13</text>
      <circle cx="345" cy="300" r="7" class="hole"/><text x="329" y="334" class="tiny">G</text>
    </g>
    <path d="M265 292 V238 H400" class="wire"/>
    <text x="305" y="227" class="small">D12 fault wire</text>
    <path d="M305 308 V365" class="ghost"/>
    <text x="320" y="365" class="small">D13 built-in LED</text>

    <text x="70" y="430" class="small">paired D22–D53 header</text>
    <text x="75" y="464" class="tiny">even</text>
    <text x="152" y="464" class="tiny">odd</text>
    <g>
      <circle cx="105" cy="500" r="7" class="hole"/><text x="70" y="507" class="tiny">34</text>
      <circle cx="180" cy="500" r="7" class="hole"/><text x="195" y="507" class="tiny">35</text>
      <circle cx="105" cy="545" r="7" class="hole"/><text x="70" y="552" class="tiny">36</text>
      <circle cx="180" cy="545" r="7" class="hole"/><text x="195" y="552" class="tiny">37</text>
      <circle cx="105" cy="590" r="8" class="used"/><text x="70" y="597" class="tiny">38</text>
      <circle cx="180" cy="590" r="7" class="hole"/><text x="195" y="597" class="tiny">39</text>
      <circle cx="105" cy="635" r="8" class="used"/><text x="70" y="642" class="tiny">40</text>
      <circle cx="180" cy="635" r="8" class="used"/><text x="195" y="642" class="tiny">41</text>
      <circle cx="105" cy="680" r="7" class="hole"/><text x="70" y="687" class="tiny">42</text>
      <circle cx="180" cy="680" r="7" class="hole"/><text x="195" y="687" class="tiny">43</text>
    </g>
    <path d="M105 590 H375" class="wire"/><text x="285" y="580" class="small">D38 pump</text>
    <path d="M105 635 H405" class="wire"/><text x="285" y="625" class="small">D40 fan</text>
    <path d="M180 635 V720 H430" class="wire"/><text x="285" y="710" class="small">D41 heater</text>

    <text x="70" y="790" class="small">power header</text>
    <circle cx="105" cy="830" r="7" class="hole"/><text x="90" y="864" class="tiny">5V</text>
    <circle cx="160" cy="830" r="8" class="used"/><text x="140" y="864" class="tiny">GND</text>
    <path d="M160 838 V890 H410" class="wire"/>
    <text x="225" y="883" class="small">one common GND rail</text>

    <!-- Breadboard -->
    <rect x="560" y="90" width="970" height="940" rx="20" class="ink"/>
    <text x="605" y="138" class="title">breadboard holes, rows, and component legs</text>
    <line x1="600" y1="205" x2="1490" y2="205" class="fine"/>
    <line x1="600" y1="905" x2="1490" y2="905" class="fine"/>
    <line x1="1490" y1="205" x2="1490" y2="905" class="wire"/>
    <text x="575" y="212" class="small">−</text>
    <text x="575" y="912" class="small">−</text>

    <!-- row and column labels -->
    <g class="tiny">
      <text x="665" y="260">a</text><text x="705" y="260">b</text><text x="745" y="260">c</text>
      <text x="785" y="260">d</text><text x="825" y="260">e</text>
      <text x="925" y="260">f</text><text x="965" y="260">g</text><text x="1005" y="260">h</text>
      <text x="1045" y="260">i</text><text x="1085" y="260">j</text>
    </g>

    <!-- representative exact hole grid, rows 5,8,10,14,17,19 -->
    <g>
      <g transform="translate(0,0)">
        <text x="610" y="315" class="tiny">5</text>
        <circle cx="670" cy="310" r="6" class="hole"/><circle cx="710" cy="310" r="6" class="hole"/>
        <circle cx="750" cy="310" r="6" class="hole"/><circle cx="790" cy="310" r="6" class="hole"/><circle cx="830" cy="310" r="6" class="hole"/>
        <circle cx="930" cy="310" r="6" class="hole"/><circle cx="970" cy="310" r="6" class="hole"/>
        <circle cx="1010" cy="310" r="6" class="hole"/><circle cx="1050" cy="310" r="6" class="hole"/><circle cx="1090" cy="310" r="6" class="hole"/>
      </g>
      <g transform="translate(0,120)"><text x="610" y="315" class="tiny">8</text>
        <circle cx="670" cy="310" r="6" class="hole"/><circle cx="710" cy="310" r="6" class="hole"/><circle cx="750" cy="310" r="6" class="hole"/><circle cx="790" cy="310" r="6" class="hole"/><circle cx="830" cy="310" r="6" class="hole"/>
        <circle cx="930" cy="310" r="6" class="hole"/><circle cx="970" cy="310" r="6" class="hole"/><circle cx="1010" cy="310" r="6" class="hole"/><circle cx="1050" cy="310" r="6" class="hole"/><circle cx="1090" cy="310" r="6" class="hole"/>
      </g>
      <g transform="translate(0,200)"><text x="600" y="315" class="tiny">10</text>
        <circle cx="670" cy="310" r="6" class="hole"/><circle cx="710" cy="310" r="6" class="hole"/><circle cx="750" cy="310" r="6" class="hole"/><circle cx="790" cy="310" r="6" class="hole"/><circle cx="830" cy="310" r="6" class="hole"/>
        <circle cx="930" cy="310" r="6" class="hole"/><circle cx="970" cy="310" r="6" class="hole"/><circle cx="1010" cy="310" r="6" class="hole"/><circle cx="1050" cy="310" r="6" class="hole"/><circle cx="1090" cy="310" r="6" class="hole"/>
      </g>
      <g transform="translate(0,360)"><text x="600" y="315" class="tiny">14</text>
        <circle cx="670" cy="310" r="6" class="hole"/><circle cx="710" cy="310" r="6" class="hole"/><circle cx="750" cy="310" r="6" class="hole"/><circle cx="790" cy="310" r="6" class="hole"/><circle cx="830" cy="310" r="6" class="hole"/>
        <circle cx="930" cy="310" r="6" class="hole"/><circle cx="970" cy="310" r="6" class="hole"/><circle cx="1010" cy="310" r="6" class="hole"/><circle cx="1050" cy="310" r="6" class="hole"/><circle cx="1090" cy="310" r="6" class="hole"/>
      </g>
      <g transform="translate(0,480)"><text x="600" y="315" class="tiny">17</text>
        <circle cx="670" cy="310" r="6" class="hole"/><circle cx="710" cy="310" r="6" class="hole"/><circle cx="750" cy="310" r="6" class="hole"/><circle cx="790" cy="310" r="6" class="hole"/><circle cx="830" cy="310" r="6" class="hole"/>
        <circle cx="930" cy="310" r="6" class="hole"/><circle cx="970" cy="310" r="6" class="hole"/><circle cx="1010" cy="310" r="6" class="hole"/><circle cx="1050" cy="310" r="6" class="hole"/><circle cx="1090" cy="310" r="6" class="hole"/>
      </g>
      <g transform="translate(0,560)"><text x="600" y="315" class="tiny">19</text>
        <circle cx="670" cy="310" r="6" class="hole"/><circle cx="710" cy="310" r="6" class="hole"/><circle cx="750" cy="310" r="6" class="hole"/><circle cx="790" cy="310" r="6" class="hole"/><circle cx="830" cy="310" r="6" class="hole"/>
        <circle cx="930" cy="310" r="6" class="hole"/><circle cx="970" cy="310" r="6" class="hole"/><circle cx="1010" cy="310" r="6" class="hole"/><circle cx="1050" cy="310" r="6" class="hole"/><circle cx="1090" cy="310" r="6" class="hole"/>
      </g>
    </g>

    <!-- exact component paths -->
    <path d="M505 590 H670 V310" class="wire"/>
    <path d="M670 310 L735 350 L770 270 L805 350 L830 430" class="ink"/>
    <path d="M830 430 V510" class="ink"/>
    <circle cx="830" cy="465" r="23" class="ink"/><line x1="815" y1="451" x2="845" y2="451" class="fine"/>
    <path d="M830 510 H1190 V205" class="wire"/>
    <text x="1160" y="430" class="small">D38 → a5 → 220 Ω → e8</text>
    <text x="1160" y="460" class="small">LED legs e8/e10 → GND rail</text>

    <path d="M505 635 H670 V670" class="wire"/>
    <path d="M670 670 L735 710 L770 630 L805 710 L830 790" class="ink"/>
    <path d="M830 790 V870" class="ink"/>
    <circle cx="830" cy="825" r="23" class="ink"/><line x1="815" y1="811" x2="845" y2="811" class="fine"/>
    <path d="M830 870 H1220 V905" class="wire"/>
    <text x="1160" y="700" class="small">D40 → a14 → 220 Ω → e17</text>
    <text x="1160" y="730" class="small">LED legs e17/e19 → GND rail</text>

    <path d="M505 720 H930 V310" class="wire"/>
    <path d="M930 310 L975 350 L1010 270 L1045 350 L1090 430" class="ink"/>
    <path d="M1090 430 V510" class="ink"/>
    <circle cx="1090" cy="465" r="23" class="ink"/><line x1="1075" y1="451" x2="1105" y2="451" class="fine"/>
    <path d="M1090 510 H1250 V205" class="wire"/>
    <text x="1160" y="520" class="small">D41 → f5 → 220 Ω → j8</text>
    <text x="1160" y="550" class="small">LED legs j8/j10 → GND rail</text>

    <path d="M505 238 H930 V670" class="wire"/>
    <path d="M930 670 L975 710 L1010 630 L1045 710 L1090 790" class="ink"/>
    <path d="M1090 790 V870" class="ink"/>
    <circle cx="1090" cy="825" r="23" class="ink"/><line x1="1075" y1="811" x2="1105" y2="811" class="fine"/>
    <path d="M1090 870 H1280 V905" class="wire"/>
    <text x="1160" y="790" class="small">D12 → f14 → 1 kΩ → j17</text>
    <text x="1160" y="820" class="small">LED legs j17/j19 → GND rail</text>

    <path d="M410 890 H560 V905" class="wire"/>
    <text x="880" y="1000" class="label">No relay. No driver. No external supply. Four LEDs only.</text>
  </g>
</svg>
