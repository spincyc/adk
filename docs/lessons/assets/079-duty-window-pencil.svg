<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <filter id="rough" x="-3%" y="-8%" width="106%" height="116%"><feTurbulence baseFrequency=".013" numOctaves="2" seed="279" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter>
    <pattern id="shade" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#999" stroke-width="2"/></pattern>
    <pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M1 15l6-2m4-9l7-2M3 5l3-1" stroke="#ddd" stroke-width=".7" opacity=".7"/></pattern>
    <style>.l{fill:none;stroke:#333;stroke-width:5;stroke-linecap:round;filter:url(#rough)}.r{fill:url(#shade);stroke:#444;stroke-width:4;filter:url(#rough)}.t,.h,.n{fill:#292929;font-family:DejaVu Sans,sans-serif}.h{font-size:29px;font-weight:bold}.t{font-size:24px}.n{font-size:21px;font-style:italic}</style>
  </defs>
  <rect width="1200" height="450" fill="white"/>
  <rect width="1200" height="450" fill="url(#paper)" opacity=".45"/>
  <g>
    <text class="h" x="40" y="55">rolling duty window at supplied “now”</text>
    <path class="l" d="M60 220H1140M95 205v32M325 205v32M570 190v60M805 205v32M1105 205v32"/>
    <text class="t" x="40" y="275">older</text><text class="t" x="530" y="285">now</text><text class="t" x="1050" y="275">future</text>
    <rect class="r" x="135" y="130" width="210" height="72"/><text class="n" x="165" y="175">closed early</text>
    <rect class="r" x="390" y="130" width="135" height="72"/><text class="n" x="405" y="175">history</text>
    <rect class="r" x="570" y="130" width="245" height="72"/><text class="n" x="610" y="175">candidate interval</text>
    <path class="l" d="M325 320c100 35 260 39 350 0"/>
    <text class="t" x="345" y="375">sum only overlaps in the fixed window</text>
    <text class="n" x="120" y="420">equality passes • one tick over rejects • expiry at the deadline returns OFF</text>
  </g>
</svg>
