<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820"
     viewBox="0 0 1400 820" role="img"
     aria-labelledby="title description">
  <title id="title">Lesson 029 inert cue panel orientation</title>
  <desc id="description">A USB-powered Mega connects to five passive buttons,
  eight separately resistor-limited cue LEDs, and one resistor-limited RGB
  state LED. TP29 marks the selected cue output. No external-load connection
  is present.</desc>
  <defs>
    <filter id="graphite" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013 0.038"
                    numOctaves="2" seed="29" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.1"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.46"
                    numOctaves="3" seed="129"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.3
                             0 0 0 0 0.3  0 0 0 .10 0"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="#fff"/>
  <rect width="1400" height="820" filter="url(#paper)" opacity=".22"/>
  <g fill="none" stroke="#333" stroke-width="6.5" opacity=".15"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#graphite)">
    <rect x="70" y="120" width="430" height="500" rx="20"/>
    <rect x="620" y="95" width="690" height="175" rx="18"/>
    <rect x="620" y="330" width="690" height="260" rx="18"/>
    <path d="M190 690H1210"/>
  </g>
  <g fill="none" stroke="#292929" stroke-width="3.6" stroke-linecap="round"
     stroke-linejoin="round" filter="url(#graphite)">
    <rect x="70" y="120" width="430" height="500" rx="20"/>
    <path d="M70 205H15M15 205V270"/>
    <rect x="15" y="270" width="55" height="28" rx="5"/>
    <rect x="620" y="95" width="690" height="175" rx="18"/>
    <rect x="620" y="330" width="690" height="260" rx="18"/>
    <path d="M500 180H620M500 365H620M500 500H620"/>
    <path d="M660 155h75m35 0h75m35 0h75m35 0h75m35 0h75"/>
    <path d="M680 135v40m200-40v40m200-40v40m200-40v40"/>
    <circle cx="695" cy="400" r="24"/><circle cx="775" cy="400" r="24"/>
    <circle cx="855" cy="400" r="24"/><circle cx="935" cy="400" r="24"/>
    <circle cx="1015" cy="400" r="24"/><circle cx="1095" cy="400" r="24"/>
    <circle cx="1175" cy="400" r="24"/><circle cx="1255" cy="400" r="24"/>
    <path d="M695 424v55m80-55v55m80-55v55m80-55v55m80-55v55m80-55v55m80-55v55m80-55v55"/>
    <path d="M670 479h50m30 0h50m30 0h50m30 0h50m30 0h50m30 0h50m30 0h50m30 0h50"/>
    <circle cx="785" cy="535" r="30"/>
    <circle cx="785" cy="535" r="18"/>
    <circle cx="785" cy="535" r="7"/>
    <path d="M815 535h90"/>
    <path d="M190 690H1210"/>
    <path d="M350 675l25 15-25 15M595 675l25 15-25 15M840 675l25 15-25 15"/>
  </g>
  <g display="none" fill="#222" font-family="DejaVu Sans, sans-serif">
    <text x="285" y="165" font-size="34" text-anchor="middle">MEGA 2560</text>
    <text x="285" y="215" font-size="24" text-anchor="middle">USB 5 V only</text>
    <text x="285" y="365" font-size="27" text-anchor="middle">D22–D29 cue outputs</text>
    <text x="285" y="410" font-size="23" text-anchor="middle">D30–D34 buttons</text>
    <text x="285" y="455" font-size="23" text-anchor="middle">D5–D7 RGB state</text>
    <text x="965" y="135" font-size="29" text-anchor="middle">five pull-up buttons to GND</text>
    <text x="680" y="205" font-size="18">REVIEW</text>
    <text x="795" y="205" font-size="18">RUN</text>
    <text x="880" y="205" font-size="18">CONFIRM</text>
    <text x="1020" y="205" font-size="18">SKIP</text>
    <text x="1135" y="205" font-size="18">CANCEL</text>
    <text x="965" y="315" font-size="29" text-anchor="middle">eight cue LEDs; one 1 kΩ resistor each</text>
    <text x="695" y="520" font-size="18" text-anchor="middle">0</text>
    <text x="775" y="520" font-size="18" text-anchor="middle">1</text>
    <text x="855" y="520" font-size="18" text-anchor="middle">2</text>
    <text x="935" y="520" font-size="18" text-anchor="middle">3</text>
    <text x="1015" y="520" font-size="18" text-anchor="middle">4</text>
    <text x="1095" y="520" font-size="18" text-anchor="middle">5</text>
    <text x="1175" y="520" font-size="18" text-anchor="middle">6</text>
    <text x="1255" y="520" font-size="18" text-anchor="middle">7</text>
    <text x="925" y="545" font-size="22">TP29: selected output to Mega GND</text>
    <text x="230" y="735" font-size="25" text-anchor="middle">review</text>
    <text x="475" y="735" font-size="25" text-anchor="middle">confirm</text>
    <text x="720" y="735" font-size="25" text-anchor="middle">visible</text>
    <text x="965" y="735" font-size="25" text-anchor="middle">audit</text>
    <text x="700" y="790" font-size="22" text-anchor="middle">
      Orientation only — inert LED simulator — no external-load connection
    </text>
  </g>
</svg>
