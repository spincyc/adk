<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <filter id="rough">
      <feTurbulence baseFrequency="0.009" numOctaves="2" seed="26" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
    <style>
      .line { fill: none; stroke: #222; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #555; stroke-width: 3; stroke-linecap: round; }
      .label { fill: #222; font-family: serif; font-size: 29px; font-style: italic; }
      .small { fill: #333; font-family: serif; font-size: 22px; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fafafa"/>
  <g filter="url(#rough)">
    <rect x="65" y="130" width="270" height="400" rx="18" class="line"/>
    <text x="112" y="185" class="label">fixture packets</text>
    <path d="M110 245 H290 M110 300 H290 M110 355 H290 M110 410 H290" class="thin"/>
    <text x="122" y="235" class="small">valid</text>
    <text x="122" y="290" class="small">gap</text>
    <text x="122" y="345" class="small">corrupt</text>
    <text x="122" y="400" class="small">silence</text>

    <path d="M335 330 H455" class="line"/>
    <path d="M430 307 l30 23 l-30 23" class="line"/>

    <rect x="460" y="105" width="300" height="450" rx="18" class="line"/>
    <text x="518" y="165" class="label">Mega 2560</text>
    <text x="508" y="230" class="small">decode exact packet</text>
    <text x="508" y="285" class="small">check CRC-16</text>
    <text x="508" y="340" class="small">track sequence</text>
    <text x="508" y="395" class="small">age from receipt</text>
    <text x="508" y="465" class="small">D13 acquisition</text>
    <text x="508" y="510" class="small">D45 evidence / TP-LED</text>

    <path d="M760 330 H855" class="line"/>
    <path d="M830 307 l30 23 l-30 23" class="line"/>
    <path d="M875 330 l45 -22 v44 z M920 330 h55" class="line"/>
    <path d="M975 307 v46 M986 311 v38" class="thin"/>
    <path d="M986 330 h32 l14 -18 l24 36 l24 -36 l24 36 l14 -18 h25" class="line"/>
    <path d="M1143 330 v170 H610 V555" class="line"/>
    <text x="855" y="275" class="label">visible state</text>
    <text x="850" y="405" class="small">one long: fresh</text>
    <text x="850" y="440" class="small">two short: sequence / aging</text>
    <text x="850" y="475" class="small">three short: stale</text>
    <text x="850" y="510" class="small">four short: corrupt</text>

    <path d="M155 610 q55 -28 110 0 q55 28 110 0" class="thin"/>
    <text x="390" y="620" class="label">receive-only fixture evidence — no radio emitter</text>
  </g>
</svg>
