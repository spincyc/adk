<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820"
     viewBox="0 0 1400 820" role="img"
     aria-labelledby="title description">
  <title id="title">Lesson 031 analog joystick orientation</title>
  <desc id="description">An inspected joystick module connects its X signal
  to Mega A0, Y signal to A1, active-low select switch to D22, and its verified
  supply and ground terminals to 5 V and ground. TP-X and TP-Y mark the analog
  signals. A common-cathode RGB LED connects through three separate one
  kiloohm resistors to D5, D6, and D7.</desc>
