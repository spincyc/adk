      <rect x="60" y="105" width="250" height="420" rx="22"/><rect x="330" y="105" width="250" height="420" rx="22"/>
      <rect x="600" y="105" width="250" height="420" rx="22"/><rect x="870" y="105" width="250" height="420" rx="22"/>
