<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="#faf9f5"/>
  <g font-family="Open Sans,sans-serif" fill="#292929" stroke="#292929" stroke-width="4">
