      <circle cx="185" cy="200" r="44"/><circle cx="455" cy="200" r="44"/><circle cx="725" cy="200" r="44"/>
      <circle cx="995" cy="200" r="44"/><circle cx="1240" cy="200" r="44"/>
      <rect x="88" y="280" width="194" height="92"/><rect x="358" y="280" width="194" height="92"/>
      <rect x="628" y="280" width="194" height="92"/><rect x="898" y="280" width="194" height="92"/>
      <rect x="1160" y="280" width="160" height="92"/>
    </g>
