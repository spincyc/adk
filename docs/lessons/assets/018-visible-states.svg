      <text x="137" y="130" font-size="23">READY</text><text x="390" y="130" font-size="23">ENTERING</text>
      <text x="662" y="130" font-size="23">GRANTED</text><text x="932" y="130" font-size="23">DENIED</text>
      <text x="1163" y="130" font-size="23">LOCKOUT</text>
      <text x="120" y="328" font-size="25">READY</text><text x="388" y="328" font-size="25">ENTER 2</text>
