<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <filter id="rough" x="-3%" y="-4%" width="106%" height="108%"><feTurbulence baseFrequency=".012" numOctaves="2" seed="79" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
    <pattern id="paper" width="19" height="17" patternUnits="userSpaceOnUse"><path d="M1 15l6-2m4-9l7-2M3 5l3-1" stroke="#ddd" stroke-width=".7" opacity=".7"/></pattern>
    <style>.p{fill:#fafafa;stroke:#323232;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}.s{fill:none;stroke:#666;stroke-width:2.5;stroke-linecap:round;filter:url(#rough)}.t,.h,.x{fill:#292929;font-family:DejaVu Sans,sans-serif}.h{font-size:29px;font-weight:bold}.t{font-size:24px}.x{font-size:22px;font-style:italic}</style>
  </defs>
  <rect width="1200" height="430" fill="#fff"/>
  <rect width="1200" height="430" fill="url(#paper)" opacity=".45"/>
  <g>
    <rect class="p" x="30" y="80" width="280" height="250" rx="12"/>
    <text class="h" x="66" y="130" style="font-size:24px">copied declaration</text>
    <text class="t" x="60" y="180">identity + revisions</text><text class="t" x="60" y="222">current ceilings</text>
    <text class="t" x="60" y="264">duration + duty</text><text class="t" x="60" y="306">flyback declaration</text>
    <path class="p" d="M330 205h90m-26-25 29 25-29 25"/>
    <rect class="p" x="445" y="48" width="330" height="315" rx="15"/>
    <text class="h" x="495" y="104">bounded policy</text>
