<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2"
        seed="9" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="1.35"/>
    </filter>
  </defs>
  <style>
    path,rect,circle,line,polyline,polygon{filter:url(#pencil)}
    text{font-family:"DejaVu Sans";fill:#181818}.title{font-size:29px}.label{font-size:22px}.tiny{font-size:17px}
    .board{fill:#faf9f4;stroke:#222;stroke-width:5}.header{fill:#e5e5e2;stroke:#333;stroke-width:3}
    .used{fill:white;stroke:#111;stroke-width:4}.hole{fill:#555}.call{fill:none;stroke:#222;stroke-width:3}
  </style>
  <rect width="1500" height="720" fill="#fbfaf5"/>
  <text x="750" y="42" text-anchor="middle" class="title">Plate 0 - physical Mega 2560 header locator (top view, USB at left)</text>
  <path class="board" d="M95 95 H1335 L1405 165 V610 H95 Z"/>
  <rect x="40" y="225" width="150" height="155" class="board"/>
  <text x="115" y="310" text-anchor="middle" class="label">USB</text>

  <!-- Digital header groups along the physical top edge, descending from left to right here. -->
  <rect x="285" y="115" width="630" height="78" class="header"/>
  <g class="hole">
    <circle cx="365" cy="154" r="11"/><circle cx="410" cy="154" r="11"/>
    <circle cx="455" cy="154" r="11"/><circle cx="500" cy="154" r="11"/><circle cx="545" cy="154" r="11"/>
    <circle cx="590" cy="154" r="11"/><circle cx="635" cy="154" r="11"/><circle cx="680" cy="154" r="11"/>
    <circle cx="725" cy="154" r="11"/><circle cx="770" cy="154" r="11"/><circle cx="815" cy="154" r="11"/>
    <circle cx="860" cy="154" r="11"/>
  </g>
  <g class="used">
    <circle cx="365" cy="154" r="16"/><circle cx="545" cy="154" r="16"/><circle cx="635" cy="154" r="16"/>
    <circle cx="680" cy="154" r="16"/><circle cx="725" cy="154" r="16"/>
  </g>
  <g class="tiny" text-anchor="middle">
    <text x="365" y="218">13</text><text x="410" y="218">12</text>
    <text x="455" y="218">11</text><text x="500" y="218">10</text><text x="545" y="218">9</text>
    <text x="590" y="218">8</text><text x="635" y="218">7</text><text x="680" y="218">6</text>
    <text x="725" y="218">5</text><text x="770" y="218">4</text><text x="815" y="218">3</text>
    <text x="860" y="218">2</text>
  </g>
  <text x="600" y="92" text-anchor="middle" class="label">DIGITAL PWM header</text>

  <!-- Physical POWER header: IOREF, RESET, 3V3, 5V, GND, GND, VIN. -->
  <rect x="285" y="500" width="420" height="78" class="header"/>
  <g class="hole">
    <circle cx="320" cy="539" r="11"/><circle cx="375" cy="539" r="11"/><circle cx="430" cy="539" r="11"/>
    <circle cx="485" cy="539" r="11"/><circle cx="540" cy="539" r="11"/><circle cx="595" cy="539" r="11"/>
    <circle cx="650" cy="539" r="11"/>
  </g>
  <g class="used"><circle cx="485" cy="539" r="16"/><circle cx="540" cy="539" r="16"/></g>
  <g class="tiny" text-anchor="middle">
    <text x="320" y="610">IOREF</text><text x="375" y="610">RESET</text><text x="430" y="610">3V3</text>
    <text x="485" y="610">5V</text><text x="540" y="610">GND</text><text x="595" y="610">GND</text>
    <text x="650" y="610">VIN</text>
  </g>
  <text x="495" y="475" text-anchor="middle" class="label">POWER header</text>

  <!-- Physical analog header at the lower-right edge: A0 begins nearest board center. -->
  <rect x="825" y="500" width="500" height="78" class="header"/>
  <g class="hole">
    <circle cx="860" cy="539" r="11"/><circle cx="915" cy="539" r="11"/><circle cx="970" cy="539" r="11"/>
    <circle cx="1025" cy="539" r="11"/><circle cx="1080" cy="539" r="11"/><circle cx="1135" cy="539" r="11"/>
    <circle cx="1190" cy="539" r="11"/><circle cx="1245" cy="539" r="11"/><circle cx="1300" cy="539" r="11"/>
  </g>
  <circle cx="860" cy="539" r="16" class="used"/>
  <g class="tiny" text-anchor="middle">
    <text x="860" y="610">A0</text><text x="915" y="610">A1</text><text x="970" y="610">A2</text>
    <text x="1025" y="610">A3</text><text x="1080" y="610">A4</text><text x="1135" y="610">A5</text>
    <text x="1190" y="610">...</text><text x="1245" y="610">A14</text><text x="1300" y="610">A15</text>
  </g>
  <text x="1075" y="475" text-anchor="middle" class="label">ANALOG IN headers</text>

  <text x="1080" y="285" text-anchor="middle" class="label">Outlined sockets are used:</text>
  <text x="1080" y="320" text-anchor="middle" class="label">D5, D6, D7, D9, D13</text>
  <text x="1080" y="355" text-anchor="middle" class="label">5V, one GND, and A0</text>
  <text x="1080" y="405" text-anchor="middle" class="tiny">Read the silkscreen before inserting a jumper.</text>
  <text x="750" y="680" text-anchor="middle" class="tiny">Header groups and order are the Mega 2560 top-view locator; the plate is not a board-dimension template.</text>
</svg>
