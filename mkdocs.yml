site_name: ADK
site_description: A deterministic C++ component library and electronics course for Arduino Mega 2560.
site_url: https://spincyc.github.io/adk/
repo_url: https://github.com/spincyc/adk
repo_name: spincyc/adk

docs_dir: build/site-source
site_dir: build/site
use_directory_urls: true
strict: true

theme:
  name: mkdocs
  locale: en

nav:
  - Home: index.md
  - Start here: start.md
  - Command-line workflow: docs/CLI.md
  - Course map: course.md
  - Lessons:
      - Course map: lessons/index.md
      - "001 — Digital output": lessons/001.md
      - "002 — Digital input": lessons/002.md
      - "003 — Reaction timer": lessons/003.md
      - "004 — PWM and RGB": lessons/004.md
      - "005 — Piezo sounder": lessons/005.md
      - "006 — Simon": lessons/006.md
      - "007 — Analog input": lessons/007.md
      - "008 — Sampled signal": lessons/008.md
      - "009 — Adaptive night light": lessons/009.md
  - Components: components.md
  - Supported API: api-supported.md
  - Design:
      - Determinism: determinism.md
      - Architecture: docs/ARCHITECTURE.md
      - Component catalog: docs/COMPONENTS.md
      - Curriculum: docs/CURRICULUM.md
      - Projects: docs/PROJECTS.md
      - Roadmap: docs/ROADMAP.md
      - Style: docs/STYLE.md
      - Mega ADC notes: docs/MEGA_ADC_NOTES.md
      - Comparable projects: docs/COMPARABLE_PROJECTS.md
  - Network research:
      - Shared constraints: docs/NETWORK_MATRIX_CONSTRAINTS.md
      - HDMI 8K architecture: docs/research/HDMI_8K_NETWORK.md
      - HDMI 8K quantitative study: docs/research/hdmi_8k_switched_network.md
      - USB 3 matrix: docs/research/USB3_NETWORK_MATRIX.md
  - Projects:
      - Cadence: projects/cadence.md
      - Reaction timer: docs/projects/reaction_timer.md
      - Deterministic Simon: docs/projects/simon.md
  - Agent and release contracts:
      - Development: docs/DEVELOPMENT.md
      - Testing: docs/TESTING.md
      - Safety model: docs/SAFETY_MODEL.md
      - Packaging: docs/PACKAGING.md
      - PDF policy: docs/PDF_POLICY.md
      - Size budgets: docs/SIZE_BUDGETS.md
  - Legacy:
      - Overview: legacy/index.md
      - Preview API: legacy/api.md
      - Lesson 001: legacy/lessons/001.md
      - Lesson 002: legacy/lessons/002.md
      - Lesson 003: legacy/lessons/003.md
  - Safety: safety.md
  - Build locally: build.md
  - Contributing: contributing.md
  - Accessibility: accessibility.md
  - About: about.md
  - License: license.md

markdown_extensions:
  - attr_list
  - fenced_code
  - sane_lists
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - assets/site.css
