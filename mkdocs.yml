      - Architecture: docs/ARCHITECTURE.md
      - Component catalog: docs/COMPONENTS.md
      - Curriculum: docs/CURRICULUM.md
      - Projects: docs/PROJECTS.md
      - Roadmap: docs/ROADMAP.md
      - Durable work queue: docs/WORK_QUEUE.md
      - Input expansion 031–033: docs/design/LESSONS_031_033_INPUT_EXPANSION_PLAN.md
      - Style: docs/STYLE.md
      - Mega ADC notes: docs/MEGA_ADC_NOTES.md
      - Comparable projects: docs/COMPARABLE_PROJECTS.md
  - Network research:
      - Shared constraints: docs/NETWORK_MATRIX_CONSTRAINTS.md
      - Shared USB and HDMI fabric: docs/research/SHARED_USB_HDMI_FABRIC.md
      - HDMI 8K architecture: docs/research/HDMI_8K_NETWORK.md
