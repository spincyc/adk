site_name: ADK
site_description: A deterministic C++ component library and electronics course for Arduino Mega 2560.
site_url: https://spincyc.github.io/adk/
repo_url: https://github.com/spincyc/adk
repo_name: spincyc/adk

docs_dir: build/site-source
site_dir: build/site
use_directory_urls: true
strict: true

theme:
  name: mkdocs
  locale: en

nav:
  - Home: index.md
  - Start here: start.md
  - Course:
      - Course map: course.md
      - Lesson index: lessons/index.md
      - Current project — IR command translator: lessons/054.md
      - Command-line workflow: docs/CLI.md
  - Library:
      - Components: components.md
      - Supported API: api-supported.md
      - Determinism: determinism.md
      - Architecture: docs/ARCHITECTURE.md
      - Component catalog: docs/COMPONENTS.md
  - Plan:
      - Curriculum: docs/CURRICULUM.md
      - Projects: docs/PROJECTS.md
      - Roadmap: docs/ROADMAP.md
      - Durable work queue: docs/WORK_QUEUE.md
      - Complete-kit cadence: docs/projects/component_project_cadence.md
  - Research:
      - USB and HDMI roadmap: projects/mesh-roadmap.md
      - Shared USB and HDMI fabric: docs/research/SHARED_USB_HDMI_FABRIC.md
      - HDMI mesh architecture: docs/research/HDMI_MESH_ARCHITECTURE.md
      - Transparent USB product: docs/research/USB_TRANSPARENT_PRODUCT.md
      - Sensor-kit taxonomy: docs/research/SENSOR_KIT_TAXONOMY.md
  - Build and safety:
      - Safety: safety.md
      - Build locally: build.md
      - Development: docs/DEVELOPMENT.md
      - Testing: docs/TESTING.md
      - Packaging: docs/PACKAGING.md
      - PDF policy: docs/PDF_POLICY.md
  - About:
      - About ADK: about.md
      - The queue that never stopped stopping: journal-story.md
      - Accessibility: accessibility.md
      - Contributing: contributing.md
      - Legacy preview: legacy/index.md
      - License: license.md

markdown_extensions:
  - attr_list
  - fenced_code
  - sane_lists
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - assets/site.css
