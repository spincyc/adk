  - Build locally: build.md
  - Contributing: contributing.md
  - Accessibility: accessibility.md
  - About: about.md
  - License: license.md

markdown_extensions:
  - attr_list
  - fenced_code
  - sane_lists
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - assets/site.css
