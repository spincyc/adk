site_name: ADK
site_description: A deterministic C++ component library and electronics course for Arduino Mega 2560.
site_url: https://spincyc.github.io/adk/
repo_url: https://github.com/spincyc/adk
repo_name: spincyc/adk

docs_dir: build/site-source
site_dir: build/site
use_directory_urls: true
strict: true

theme:
  name: mkdocs
  locale: en

nav:
  - Home: index.md
  - Start here: start.md
  - Command-line workflow: docs/CLI.md
  - Course map: course.md
  - Lessons:
      - Course map: lessons/index.md
      - "001 — Digital output": lessons/001.md
      - "002 — Digital input": lessons/002.md
      - "003 — Reaction timer": lessons/003.md
      - "004 — PWM and RGB": lessons/004.md
      - "005 — Piezo sounder": lessons/005.md
      - "006 — Simon": lessons/006.md
      - "007 — Analog input": lessons/007.md
      - "008 — Sampled signal": lessons/008.md
      - "009 — Adaptive night light": lessons/009.md
      - "010 — Shift register display": lessons/010.md
      - "011 — Timed traffic states": lessons/011.md
      - "012 — Traffic junction": lessons/012.md
      - "013 — DHT11 climate sensor": lessons/013.md
      - "014 — Character display": lessons/014.md
      - "015 — Environmental station": lessons/015.md
      - "016 — Matrix keypad": lessons/016.md
      - "017 — Bounded servo intent": lessons/017.md
      - "018 — Inert access trainer": lessons/018.md
      - "019 — Ultrasonic range": lessons/019.md
      - "020 — Motor intent": lessons/020.md
      - "021 — Bench rover": lessons/021.md
      - "022 — Owned buses and durable records": lessons/022.md
