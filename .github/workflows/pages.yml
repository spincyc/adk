name: Publish Pages

on:
    workflow_run:
        workflows:
            - Quality
        types:
            - completed
    workflow_dispatch:

permissions: {}

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        if: >-
            (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.conclusion == 'success')
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
            pages: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.13"

            - name: Install pinned site generator
              run: python -m pip install --disable-pip-version-check mkdocs==1.6.1

            - name: Build and validate site
              run: make site-check

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: build/site

    deploy:
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            pages: write
            id-token: write
        outputs:
            page_url: ${{ steps.deployment.outputs.page_url }}
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

    verify:
        needs: deploy
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out deployment verifier
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Verify deployed Pages content
              env:
                  PAGES_URL: ${{ needs.deploy.outputs.page_url }}
              run: >-
                  python scripts/check_deployed_site.py "$PAGES_URL"
                  --retries 11 --retry-delay 10
