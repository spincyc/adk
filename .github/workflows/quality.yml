name: Quality

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions: {}

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    library:
        name: Style and host tests
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        env:
            # GCC 14 is the runner's first to report C++23 as 202302L.
            CXX: g++-14
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check style
              run: make style

            - name: Run host tests
              run: make -j4 test

            - name: Run host tests under the sanitizers
              run: make -j4 sanitize

    firmware:
        name: Mega 2560 examples
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        env:
            CXX: g++-14
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Arduino CLI
              env:
                  ARDUINO_CLI_ARCHIVE_SHA256: f4e49fb6f5d6a043f7df792ef057143c542140508081aaa52d214a9ab33141c8
                  ARDUINO_CLI_VERSION: 1.5.0
              run: |
                  archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
                  url="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}"
                  curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${archive}" "${url}"
                  echo "${ARDUINO_CLI_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
                  tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" arduino-cli
                  mkdir -p "${RUNNER_TEMP}/bin"
                  install "${RUNNER_TEMP}/arduino-cli" "${RUNNER_TEMP}/bin/arduino-cli"
                  echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

            - name: Install AVR core
              run: |
                  arduino-cli core update-index
                  arduino-cli core install arduino:avr@1.8.8

            - name: Fetch the C++23 avr-gcc
              run: make toolchain

            - name: Compile every example
              run: make -j4 examples

            - name: Run every example under the sanitizers
              run: make -j4 smoke

            - name: Run tests on a simulated Mega
              run: make avr-test

            - name: Check each sketch against its circuit
              run: make -j4 pins

            - name: Report sizes
              run: |
                  {
                      echo "## Flash and RAM per example"
                      echo
                      echo '```text'
                      make --no-print-directory size
                      echo '```'
                  } >> "${GITHUB_STEP_SUMMARY}"

    site:
        name: Website and lesson PDFs
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            pages: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Configure Pages
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  # The Python that docs/requirements.txt is locked with.
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: docs/requirements.txt

            - name: Build the site and print every lesson
              run: make pdf CHROMIUM=google-chrome

            - name: Upload Pages artifact
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: build/site

    boards:
        name: ADK Boards package
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Learners keep installed versions. Compare parsed records so
            # duplicate lines cannot replace them, and protect host artifacts.
            - name: Check published versions of ADK Boards are unchanged
              if: github.event_name != 'workflow_dispatch'
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: |
                  git fetch --quiet --depth=1 origin "${BASE}"
                  python3 docs/_theme/board_history.py FETCH_HEAD

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  # The Python that docs/requirements.txt is locked with.
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: docs/requirements.txt

            - name: Install Arduino CLI
              env:
                  ARDUINO_CLI_ARCHIVE_SHA256: f4e49fb6f5d6a043f7df792ef057143c542140508081aaa52d214a9ab33141c8
                  ARDUINO_CLI_VERSION: 1.5.0
              run: |
                  archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
                  url="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}"
                  curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${archive}" "${url}"
                  echo "${ARDUINO_CLI_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
                  tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" arduino-cli
                  mkdir -p "${RUNNER_TEMP}/bin"
                  install "${RUNNER_TEMP}/arduino-cli" "${RUNNER_TEMP}/bin/arduino-cli"
                  echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

            - name: Install ADK Boards from the site's index and compile with it
              run: make boards

            # The index and archive that make boards just installed, for the
            # Windows and macOS installs below.
            - name: Keep the board package
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: adk-boards-package
                  path: |
                      build/site/package_adk_index.json
                      build/site/adk-avr-*.tar.bz2
                  if-no-files-found: error
                  retention-days: 1

    # Most learners install ADK Boards in the IDE on Windows or macOS, where
    # Boards Manager fetches a different compiler download. Install the
    # package the boards job built, as Boards Manager would, and compile
    # Lesson 1 with it; Adk.h refuses any compiler before C++23.
    boards-installs:
        name: ADK Boards on ${{ matrix.os }}
        needs: boards
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      archive: arduino-cli_1.5.0_Windows_64bit.zip
                      sha256: c64062b6924bc302977e6d23a607f0aa6a1019e1418df7b093fa00e0b7381727
                    - os: macos-15
                      archive: arduino-cli_1.5.0_macOS_ARM64.tar.gz
                      sha256: 62f3c5749e6b7f8a3d2a147da4fe32d704c1319ff40d4ba05e9d85f27b784404
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        permissions:
            contents: read
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Fetch the board package
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: adk-boards-package
                  path: ${{ runner.temp }}/package

            - name: Install Arduino CLI
              env:
                  ARCHIVE: ${{ matrix.archive }}
                  ARCHIVE_SHA256: ${{ matrix.sha256 }}
              run: |
                  temp="${RUNNER_TEMP}"
                  if [ "${RUNNER_OS}" = Windows ]; then temp="$(cygpath --mixed "${RUNNER_TEMP}")"; fi
                  url="https://github.com/arduino/arduino-cli/releases/download/v1.5.0/${ARCHIVE}"
                  curl --fail --location --silent --show-error --output "${temp}/${ARCHIVE}" "${url}"
                  if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
                  actual="$(${sum} "${temp}/${ARCHIVE}")"
                  actual="${actual%% *}"
                  if [ "${actual}" != "${ARCHIVE_SHA256}" ]; then
                      echo "${ARCHIVE}: SHA-256 ${actual}, not ${ARCHIVE_SHA256}"
                      exit 1
                  fi
                  mkdir -p "${temp}/bin"
                  case "${ARCHIVE}" in
                      *.zip) python -m zipfile -e "${temp}/${ARCHIVE}" "${temp}/bin" ;;
                      *) tar -xzf "${temp}/${ARCHIVE}" -C "${temp}/bin" arduino-cli ;;
                  esac
                  echo "${temp}/bin" >> "${GITHUB_PATH}"

            # Directories of its own, as make boards uses, and the index by a
            # file URL, file:///D:/a/_temp/... on Windows. Boards Manager takes
            # an archive already in its downloads folder when its checksum and
            # size match the index, as they do for the version not yet live.
            - name: Point Arduino CLI at the package
              run: |
                  temp="${RUNNER_TEMP}"
                  file="file://${RUNNER_TEMP}"
                  if [ "${RUNNER_OS}" = Windows ]; then
                      temp="$(cygpath --mixed "${RUNNER_TEMP}")"
                      file="file:///${temp}"
                  fi
                  {
                      echo "ARDUINO_DIRECTORIES_DATA=${temp}/arduino/data"
                      echo "ARDUINO_DIRECTORIES_DOWNLOADS=${temp}/arduino/downloads"
                      echo "ARDUINO_DIRECTORIES_USER=${temp}/arduino/user"
                      echo "ARDUINO_BUILD_CACHE_PATH=${temp}/arduino/cache"
                      echo "ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS=${file}/package/package_adk_index.json"
                      echo "SKETCHES=${temp}/sketches"
                  } >> "${GITHUB_ENV}"
                  mkdir -p "${temp}/arduino/downloads/packages"
                  cp "${temp}"/package/adk-avr-*.tar.bz2 "${temp}/arduino/downloads/packages/"

            - name: Install ADK Boards
              run: |
                  arduino-cli core update-index
                  arduino-cli core install arduino:avr@1.8.8 adk:avr
                  arduino-cli core list

            - name: Compile Lesson 1 with ADK Boards
              run: |
                  mkdir -p "${SKETCHES}"
                  arduino-cli compile --fqbn adk:avr:mega --library . --warnings all \
                      --build-path "${SKETCHES}/001-blink" examples/lessons/001-blink 2>&1 \
                      | tee "${SKETCHES}/001-blink.log"
                  if grep -E '(src|examples)[/\\][^:]+:[0-9]+:[0-9]+: warning' "${SKETCHES}/001-blink.log"; then
                      exit 1
                  fi

    arduino-lint:
        name: Arduino library lint
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Lint library structure
              uses: arduino/arduino-lint-action@9a3603836c75e41753e531167395edeb90ba5dae # v3.0.0
              with:
                  compliance: strict
                  project-type: library
                  recursive: true
                  version: 1.3.0
                  verbose: true

    deploy:
        name: Publish Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: [library, firmware, site, boards, boards-installs, arduino-lint]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
