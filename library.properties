sentence=Declare the parts of a circuit and let them run: LEDs, buttons, sound, displays, motors and sensors for the Arduino Mega 2560.
paragraph=Every part is an object. adk::setup () claims its pins and stops with a blinking pin number if two parts share one; adk::update () keeps buttons debounced, LEDs blinking and melodies playing without blocking. No heap, no Arduino libraries, and nothing costs flash or RAM unless a sketch uses it.
